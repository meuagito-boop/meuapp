version: '3.9'

services:
  # ============ PostgreSQL Database ============
  postgres:
    image: postgres:16-alpine
    container_name: meuagito-postgres
    environment:
      POSTGRES_USER: meuagito
      POSTGRES_PASSWORD: meuagito123
      POSTGRES_DB: meu_agito_db
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meuagito"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meuagito-network

  # ============ Redis Cache ============
  redis:
    image: redis:7-alpine
    container_name: meuagito-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meuagito-network

  # ============ NestJS Backend ============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meuagito-backend
    environment:
      DATABASE_URL: postgresql://meuagito:meuagito123@postgres:5432/meu_agito_db?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/node_modules:/app/node_modules
    command: npm run start:dev
    networks:
      - meuagito-network

  # ============ pgAdmin (Database Management) ============
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: meuagito-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - meuagito-network

volumes:
  postgres_data:
  redis_data:

networks:
  meuagito-network:
    driver: bridge
