services:
  # ============ PostgreSQL Database ============
  postgres:
    image: postgres:16-alpine
    container_name: meuagito-postgres
    environment:
      POSTGRES_USER: meuagito
      POSTGRES_PASSWORD: meuagito123
      POSTGRES_DB: meu_agito_db
      TZ: UTC
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meuagito -d meu_agito_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meuagito-network

  # ============ PostgreSQL Test Database ============
  postgres-test:
    image: postgres:16-alpine
    container_name: meuagito-postgres-test
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: meu_agito_test
      TZ: UTC
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d meu_agito_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meuagito-network

  # ============ Redis Cache ============
  redis:
    image: redis:7-alpine
    container_name: meuagito-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meuagito-network

  # ============ NestJS Backend ============
  backend:
    image: node:20-alpine
    container_name: meuagito-backend
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://meuagito:meuagito123@postgres:5432/meu_agito_db?schema=public
      REDIS_URL: redis://redis:6379
      ENABLE_REDIS: "true"
      NODE_ENV: development
      PORT: "3001"
      TRUST_PROXY: "false"
      ENABLE_SWAGGER: "true"
      CORS_ORIGIN: http://localhost:3000,http://localhost:8081,http://localhost:19006
      FRONTEND_URL: http://localhost:8081,http://localhost:19006
      JWT_SECRET: docker-local-jwt-secret-change-me
      REFRESH_TOKEN_SECRET: docker-local-refresh-secret-change-me
      JWT_EXPIRATION: 15m
      REFRESH_TOKEN_EXPIRATION: 7d
      STORAGE_PROVIDER: none
      ENABLE_EMAIL: "false"
      EMAIL_PROVIDER: none
      PUSH_PROVIDER: none
      LOG_LEVEL: info
      APP_NAME: meu-agito-backend
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3001/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: >
      sh -c "apk add --no-cache openssl >/dev/null &&
      if [ ! -d node_modules/@nestjs ]; then npm ci; fi &&
      npm run prisma:generate &&
      npm run prisma:migrate:prod &&
      npm run start:dev"
    networks:
      - meuagito-network

  # ============ pgAdmin (Database Management) ============
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: meuagito-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - meuagito-network

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:

networks:
  meuagito-network:
    driver: bridge
